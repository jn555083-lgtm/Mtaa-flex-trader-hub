name: Extract MtaaFlex App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application ZIP
        run: |
          mkdir -p extracted
          unzip -o mtaaflex-trader-hub-production.zip -d extracted

          if [ -d "extracted/mtaaflex-trader-hub-production" ]; then
            cp -r extracted/mtaaflex-trader-hub-production/. .
          else
            cp -r extracted/. .
          fi

          rm -rf extracted
          rm -f mtaaflex-trader-hub-production.zip

      - name: Commit application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract MtaaFlex Trader Hub application" || echo "Nothing to commit"
          git push
